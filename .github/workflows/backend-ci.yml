name: backend-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Superseded runs on the same branch are cancelled, but never on dev/main —
# every commit on an integration branch keeps its own recorded result.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Lint e testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      # setup-uv não publica mais tags de major/minor desde a v8.0.0, então a
      # referência é o commit imutável da release — conforme o próprio README.
      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked falha se uv.lock estiver defasado em relação ao
      # pyproject.toml, em vez de re-resolver silenciosamente.
      - name: Instalar dependências
        run: uv sync --all-groups --locked

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — formatação
        run: uv run ruff format --check .

      # Cobertura mínima de 70% (RNF10). Testes usam PostgreSQL real via
      # testcontainers — o runner ubuntu-latest já provê Docker.
      - name: Testes com cobertura
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70
