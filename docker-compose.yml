services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigi}
      POSTGRES_DB: ${POSTGRES_DB:-sigi}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigi} -d ${POSTGRES_DB:-sigi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sigi:sigi@db:5432/sigi}
      APP_ENV: ${APP_ENV:-development}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
